      EDC_OAUTH_PROVIDER_AUDIENCE: http://keycloak:8080/realms/dataspace
      EDC_OAUTH_VALIDATION_NBF_LEEWAY: 20
      EDC_OAUTH_VALIDATION_ISSUED_AT_LEEWAY: 5
      EDC_AGENT_IDENTITY_KEY: participant_id
      EDC_PARTICIPANT_ID: company2
      EDC_NODES_FILE_PATH: /resources/nodes.properties
      EDC_LOGGING_LEVEL: DEBUG
      EDC_CATALOG_CACHE_ENABLED: true
      EDC_CATALOG_CACHE_EXECUTION_ENABLED: true
      EDC_CATALOG_CACHE_EXECUTION_DELAY_SECONDS: 60
      EDC_CATALOG_CACHE_EXECUTION_PERIOD_SECONDS: 120
      EDC_CATALOG_CACHE_PARTITION_NUM_CRAWLERS: 2
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:1044"
    healthcheck:
